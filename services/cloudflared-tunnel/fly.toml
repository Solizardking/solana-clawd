app = "clawd-tunnel"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NO_AUTOUPDATE = "true"

# cloudflared exposes a metrics+readiness HTTP server on port 2000.
# Fly uses it for health checks. The tunnel itself is outbound-only;
# no public ingress needed, but Fly needs an http_service block to
# manage min_machines_running.
[http_service]
  internal_port = 2000
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/ready"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
