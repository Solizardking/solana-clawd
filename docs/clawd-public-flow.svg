<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 180" role="img" aria-labelledby="title desc">
  <title id="title">OpenClawd public release flow</title>
  <desc id="desc">Animated flow from local development through guardrails to public deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.52" stop-color="#10251f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#facc15"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="960" height="180" rx="18" fill="url(#bg)"/>
  <path d="M72 96 C205 28 275 152 408 86 S612 56 720 98 S838 132 890 74" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" opacity="0.95" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" values="20 22;54 10;20 22" dur="5.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="0;-128" dur="5.6s" repeatCount="indefinite"/>
  </path>
  <g fill="#0d1117" stroke="#e5e7eb" stroke-width="2">
    <circle cx="96" cy="90" r="28"/>
    <circle cx="306" cy="94" r="28"/>
    <circle cx="504" cy="86" r="28"/>
    <circle cx="702" cy="98" r="28"/>
    <circle cx="864" cy="78" r="28"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
    <text x="96" y="96" fill="#e5e7eb" font-size="14" font-weight="700">LOCAL</text>
    <text x="306" y="100" fill="#e5e7eb" font-size="14" font-weight="700">GUARD</text>
    <text x="504" y="92" fill="#e5e7eb" font-size="14" font-weight="700">BUILD</text>
    <text x="702" y="104" fill="#e5e7eb" font-size="14" font-weight="700">DEPLOY</text>
    <text x="864" y="84" fill="#e5e7eb" font-size="14" font-weight="700">PUBLIC</text>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="48" y="40" fill="#f8fafc" font-size="24" font-weight="800">OpenClawd Solana</text>
    <text x="48" y="64" fill="#a7f3d0" font-size="14">Secrets stay local. Public code stays verifiable.</text>
    <text x="694" y="150" fill="#cbd5e1" font-size="13">audit:repo -> .dockerignore -> .vercelignore -> README</text>
  </g>
  <circle cx="72" cy="96" r="5" fill="#facc15" filter="url(#glow)">
    <animateMotion dur="5.6s" repeatCount="indefinite" path="M0 0 C133 -68 203 56 336 -10 S540 -40 648 2 S766 36 818 -22"/>
  </circle>
</svg>
