<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clawd Agent Hub</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --accent: #00ffaa;
      --accent2: #7c3aed;
      --text: #e2e8f0;
      --muted: #64748b;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
      --font: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .logo {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--muted); font-weight: 400; }
    .badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .badge-green { background: rgba(34,197,94,.15); color: var(--success); }
    .badge-purple { background: rgba(124,58,237,.15); color: #a78bfa; }
    .header-stats {
      margin-left: auto;
      display: flex;
      gap: 24px;
      font-size: 11px;
      color: var(--muted);
    }
    .stat-val { color: var(--text); font-weight: 600; margin-right: 4px; }
    /* ── Layout ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      min-width: 200px;
      border-right: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-section {
      padding: 12px 16px 4px;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }
    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background .15s, border-color .15s;
      color: var(--muted);
    }
    .sidebar-item:hover { background: rgba(255,255,255,.04); color: var(--text); }
    .sidebar-item.active {
      border-left-color: var(--accent);
      color: var(--accent);
      background: rgba(0,255,170,.05);
    }
    .sidebar-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .sidebar-dot.active { background: var(--success); }
    /* ── Main ── */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    /* ── Search bar ── */
    .search-bar {
      display: flex;
      gap: 8px;
    }
    .search-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      outline: none;
      transition: border-color .15s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }
    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-family: var(--font);
      font-size: 12px;
      transition: border-color .15s, background .15s;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-accent {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }
    .btn-accent:hover { background: #00e699; }
    /* ── Filter row ── */
    .filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-chip {
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: var(--font);
      font-size: 11px;
      cursor: pointer;
      transition: all .15s;
    }
    .filter-chip:hover, .filter-chip.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,255,170,.05);
    }
    /* ── Agent grid ── */
    .agent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
    }
    .agent-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      cursor: pointer;
      transition: border-color .15s, transform .1s;
      position: relative;
    }
    .agent-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .agent-card-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }
    .agent-avatar {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .agent-name { font-weight: 600; font-size: 14px; line-height: 1.3; }
    .agent-address {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
      font-family: var(--font);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
    }
    .agent-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .agent-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .tag {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      background: rgba(124,58,237,.15);
      color: #a78bfa;
    }
    .tag.service { background: rgba(0,255,170,.1); color: var(--accent); }
    .status-dot {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--success);
    }
    .status-dot.inactive { background: var(--muted); }
    /* ── Panel / Detail ── */
    .detail-panel {
      display: none;
      position: fixed;
      right: 0; top: 0; bottom: 0;
      width: 420px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 24px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: -8px 0 32px rgba(0,0,0,.5);
    }
    .detail-panel.open { display: flex; flex-direction: column; gap: 16px; }
    .panel-close {
      position: absolute;
      top: 16px; right: 16px;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      width: 28px; height: 28px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .panel-close:hover { border-color: var(--danger); color: var(--danger); }
    .panel-title { font-size: 18px; font-weight: 700; padding-right: 40px; }
    .panel-section-title {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .panel-row {
      display: flex;
      gap: 8px;
      font-size: 12px;
      margin-bottom: 4px;
    }
    .panel-label { color: var(--muted); min-width: 80px; flex-shrink: 0; }
    .panel-val { color: var(--text); word-break: break-all; }
    .copy-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      padding: 0 4px;
    }
    .copy-btn:hover { color: var(--accent); }
    .service-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .service-name { font-weight: 600; color: var(--accent); min-width: 60px; }
    .service-ep { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* ── Empty / Loading ── */
    .empty {
      text-align: center;
      padding: 60px 0;
      color: var(--muted);
    }
    .empty-title { font-size: 20px; margin-bottom: 8px; }
    .empty-hint { font-size: 12px; line-height: 1.8; }
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      padding: 10px 16px;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 8px;
      font-size: 12px;
      color: var(--accent);
      opacity: 0;
      transform: translateY(8px);
      transition: all .2s;
      pointer-events: none;
      z-index: 9999;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    /* ── Add agent modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-title { font-size: 16px; font-weight: 700; }
    label { font-size: 11px; color: var(--muted); margin-bottom: 2px; display: block; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">🦞 clawd<span>-hub</span></div>
  <div class="badge badge-green">● live</div>
  <div class="badge badge-purple">Solana</div>
  <div class="header-stats">
    <span><span class="stat-val" id="stat-total">—</span> agents</span>
    <span><span class="stat-val" id="stat-active">—</span> active</span>
    <span><span class="stat-val" id="stat-network">solana-mainnet</span></span>
  </div>
</header>

<!-- Layout -->
<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-section">Browse</div>
    <div class="sidebar-item active" data-filter="">
      <div class="sidebar-dot active"></div>All agents
    </div>
    <div class="sidebar-item" data-filter="service=A2A">
      <div class="sidebar-dot"></div>A2A agents
    </div>
    <div class="sidebar-item" data-filter="service=MCP">
      <div class="sidebar-dot"></div>MCP servers
    </div>
    <div class="sidebar-item" data-filter="service=web">
      <div class="sidebar-dot"></div>Web agents
    </div>
    <div class="sidebar-section" style="margin-top:8px">Networks</div>
    <div class="sidebar-item" data-filter="network=solana-mainnet">
      <div class="sidebar-dot"></div>Mainnet
    </div>
    <div class="sidebar-item" data-filter="network=solana-devnet">
      <div class="sidebar-dot"></div>Devnet
    </div>
    <div class="sidebar-section" style="margin-top:8px">Trust</div>
    <div class="sidebar-item" data-filter="capability=tee">
      <div class="sidebar-dot"></div>TEE-attested
    </div>
    <div class="sidebar-item" data-filter="capability=reputation">
      <div class="sidebar-dot"></div>Reputation
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="search-bar">
      <input
        class="search-input"
        id="search-input"
        type="text"
        placeholder="Search agents by name, description, or capability..."
      />
      <button class="btn" onclick="loadAgents()">Search</button>
      <button class="btn btn-accent" onclick="openAddModal()">+ Add Agent</button>
    </div>

    <div id="agent-list">
      <div class="spinner"></div>
    </div>
  </main>
</div>

<!-- Detail panel -->
<div class="detail-panel" id="detail-panel">
  <button class="panel-close" onclick="closeDetail()">✕</button>
  <div id="detail-content"></div>
</div>

<!-- Add Agent Modal -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <div class="modal-title">Add Agent to Index</div>
    <div>
      <label>Asset Address</label>
      <input class="search-input" id="add-address" placeholder="Base58 asset address..." style="width:100%" />
    </div>
    <div>
      <label>RPC URL (optional)</label>
      <input class="search-input" id="add-rpc" placeholder="https://api.mainnet-beta.solana.com" style="width:100%" />
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeAddModal()">Cancel</button>
      <button class="btn btn-accent" onclick="addAgent()">Fetch & Index</button>
    </div>
    <div id="add-status" style="font-size:12px;color:var(--muted)"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const API = '/api/v1';
let activeFilter = '';

function toast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = ok ? 'var(--accent)' : 'var(--danger)';
  el.style.color = ok ? 'var(--accent)' : 'var(--danger)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

async function loadStats() {
  try {
    const r = await fetch(`${API}/agents/stats`);
    const { stats } = await r.json();
    document.getElementById('stat-total').textContent = stats.total;
    document.getElementById('stat-active').textContent = stats.active;
    const nets = Object.entries(stats.byNetwork || {});
    if (nets.length === 1) document.getElementById('stat-network').textContent = nets[0][0];
  } catch {}
}

async function loadAgents(extraFilter = '') {
  const q = document.getElementById('search-input').value.trim();
  const filter = activeFilter || extraFilter;
  const params = new URLSearchParams();
  if (q) params.set('q', q);
  if (filter) {
    const parts = filter.split('&');
    parts.forEach(p => {
      const [k, v] = p.split('=');
      params.set(k, v);
    });
  }

  const list = document.getElementById('agent-list');
  list.innerHTML = '<div class="spinner"></div>';

  try {
    const r = await fetch(`${API}/agents?${params}`);
    const { agents } = await r.json();
    renderAgents(agents || []);
    loadStats();
  } catch (err) {
    list.innerHTML = `<div class="empty"><div class="empty-title">Hub unreachable</div><div class="empty-hint">Make sure clawd-hub is running on port 3747.<br/><code>clawd-hub start</code></div></div>`;
  }
}

function emoji(name = '') {
  const map = { trading: '📈', research: '🔬', chat: '💬', analytics: '📊', defi: '🏦', nft: '🎨', data: '🗄️', mcp: '🔌', a2a: '🤝' };
  const low = name.toLowerCase();
  for (const [k, v] of Object.entries(map)) if (low.includes(k)) return v;
  return '🤖';
}

function short(addr = '') {
  return addr.slice(0, 4) + '…' + addr.slice(-4);
}

function renderAgents(agents) {
  const list = document.getElementById('agent-list');
  if (!agents.length) {
    list.innerHTML = `<div class="empty">
      <div class="empty-title">No agents found</div>
      <div class="empty-hint">
        Add agents with the <strong>+ Add Agent</strong> button<br/>
        or via CLI: <code>clawd-registry add &lt;address&gt;</code>
      </div>
    </div>`;
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'agent-grid';

  agents.forEach(agent => {
    const card = document.createElement('div');
    card.className = 'agent-card';
    card.onclick = () => openDetail(agent);

    const services = agent.metadata?.services || [];
    const models = agent.metadata?.models || [];

    card.innerHTML = `
      <div class="status-dot ${agent.active ? '' : 'inactive'}"></div>
      <div class="agent-card-header">
        <div class="agent-avatar">${emoji(agent.name)}</div>
        <div>
          <div class="agent-name">${escHtml(agent.name)}</div>
          <div class="agent-address">${short(agent.assetAddress)}</div>
        </div>
      </div>
      <div class="agent-desc">${escHtml(agent.metadata?.description || 'No description')}</div>
      <div class="agent-tags">
        ${services.slice(0,3).map(s => `<span class="tag service">${escHtml(s.name)}</span>`).join('')}
        ${models.slice(0,2).map(m => `<span class="tag">${escHtml(m)}</span>`).join('')}
        <span class="tag">${escHtml(agent.network)}</span>
      </div>
    `;
    grid.appendChild(card);
  });

  list.innerHTML = '';
  list.appendChild(grid);
}

function openDetail(agent) {
  const panel = document.getElementById('detail-panel');
  const content = document.getElementById('detail-content');
  const services = agent.metadata?.services || [];
  const trust = agent.metadata?.supportedTrust || [];
  const models = agent.metadata?.models || [];

  content.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
      <div class="agent-avatar" style="width:48px;height:48px;font-size:22px">${emoji(agent.name)}</div>
      <div>
        <div class="panel-title">${escHtml(agent.name)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">${agent.active ? '● active' : '○ inactive'}</div>
      </div>
    </div>

    ${agent.metadata?.description ? `<div style="font-size:12px;color:var(--muted);line-height:1.6">${escHtml(agent.metadata.description)}</div>` : ''}

    <div>
      <div class="panel-section-title">On-chain identity</div>
      <div class="panel-row">
        <span class="panel-label">Address</span>
        <span class="panel-val" style="font-size:10px">${agent.assetAddress}</span>
        <button class="copy-btn" onclick="copy('${agent.assetAddress}')">copy</button>
      </div>
      <div class="panel-row">
        <span class="panel-label">Owner</span>
        <span class="panel-val" style="font-size:10px">${agent.owner}</span>
      </div>
      <div class="panel-row">
        <span class="panel-label">Network</span>
        <span class="panel-val">${agent.network}</span>
      </div>
      ${agent.uri ? `<div class="panel-row"><span class="panel-label">URI</span><a href="${agent.uri}" target="_blank" style="color:var(--accent);font-size:11px;word-break:break-all">${agent.uri}</a></div>` : ''}
    </div>

    ${services.length ? `
    <div>
      <div class="panel-section-title">Services</div>
      ${services.map(s => `
        <div class="service-row">
          <span class="service-name">${escHtml(s.name)}</span>
          <a href="${s.endpoint}" target="_blank" class="service-ep" style="color:var(--muted)">${escHtml(s.endpoint)}</a>
          ${s.version ? `<span style="font-size:10px;color:var(--muted);flex-shrink:0">v${s.version}</span>` : ''}
        </div>
      `).join('')}
    </div>` : ''}

    ${models.length ? `
    <div>
      <div class="panel-section-title">Models</div>
      <div class="agent-tags">${models.map(m => `<span class="tag">${escHtml(m)}</span>`).join('')}</div>
    </div>` : ''}

    ${trust.length ? `
    <div>
      <div class="panel-section-title">Trust</div>
      <div class="agent-tags">${trust.map(t => `<span class="tag service">${escHtml(t)}</span>`).join('')}</div>
    </div>` : ''}

    <div style="margin-top:8px">
      <button class="btn btn-accent" style="width:100%" onclick="copy('${agent.assetAddress}');toast('Address copied!')">Copy address</button>
    </div>
  `;

  panel.classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
}

function openAddModal() {
  document.getElementById('add-modal').classList.add('open');
}
function closeAddModal() {
  document.getElementById('add-modal').classList.remove('open');
  document.getElementById('add-status').textContent = '';
}

async function addAgent() {
  const address = document.getElementById('add-address').value.trim();
  const rpc = document.getElementById('add-rpc').value.trim();
  const status = document.getElementById('add-status');

  if (!address) { status.textContent = 'Address required'; return; }

  status.textContent = 'Fetching from chain...';
  try {
    const r = await fetch(`${API}/agents/index`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ address, rpc: rpc || undefined }),
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error);
    status.textContent = '';
    closeAddModal();
    toast(`✓ Added ${data.agent.name}`);
    loadAgents();
  } catch (err) {
    status.style.color = 'var(--danger)';
    status.textContent = `Error: ${err.message}`;
  }
}

function copy(text) {
  navigator.clipboard.writeText(text).then(() => toast('Copied!')).catch(() => {});
}

function escHtml(s = '') {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Sidebar nav
document.querySelectorAll('.sidebar-item').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.sidebar-item').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    activeFilter = el.dataset.filter || '';
    loadAgents();
  });
});

// Search on Enter
document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadAgents();
});

// WebSocket for live updates
function connectWS() {
  const ws = new WebSocket(`ws://localhost:3747/ws`);
  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'agent:indexed' || ev.type === 'agent:updated') {
      loadAgents();
    }
  };
  ws.onclose = () => setTimeout(connectWS, 3000);
}

// Init
loadAgents();
try { connectWS(); } catch {}
