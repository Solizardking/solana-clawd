worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;

    # v2 — no more websocket proxy to ttyd. Static homebase only.

    server {
        listen 7860;
        server_name _;

        root /home/user/web;
        index index.html;

        # Homebase landing
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
