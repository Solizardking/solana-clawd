[supervisord]
nodaemon=true
user=user
logfile=/var/log/nginx/supervisord.log
pidfile=/run/supervisord.pid

; v2 — ttyd program removed. HF abuse-handler was tripping on
; "ttyd + outbound to huggingface.co". Static homebase only.

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/var/log/nginx/nginx.out.log
stderr_logfile=/var/log/nginx/nginx.err.log
