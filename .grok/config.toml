# Clawd Code — Grok-style configuration
# Compatible with the xAI Grok CLI subset of TOML that Clawd Code understands
# (see parseGrokConfigToml() in clawd-code/src/env.ts).
#
# Locations (later overrides earlier):
#   ~/.grok/config.toml      — user-level
#   ./.grok/config.toml      — project-level (this file)
#
# Run `clawd-code /inspect` to see how this file is interpreted at runtime.

[models]
# Default model for code / REPL / trade modes. Research mode automatically
# uses grok-4.20-multi-agent unless CLAWD_MODEL is overridden in env.
default = "grok-4.3"

# Built-in aliases that `clawd-code /models` and `--model` understand.
# Uncomment / extend to add your own.

# [model.grok-fast]
# model = "grok-4.3-fast"
# base_url = "https://api.x.ai/v1"
# name = "Grok Fast"
# env_key = "XAI_API_KEY"

# [model.grok-multi]
# model = "grok-4.20-multi-agent"
# base_url = "https://api.x.ai/v1"
# name = "Grok Multi-Agent"
# env_key = "XAI_API_KEY"

# [model.grok-voice]
# model = "grok-voice-think-fast-1.0"
# base_url = "https://api.x.ai/v1"
# name = "Grok Voice"
# env_key = "XAI_API_KEY"

[ui]
# ask = prompt for permission on every tool call
# always-approve = skip permission prompts
permission_mode = "ask"

[session]
# Auto-compact conversation when context reaches N% of the window.
auto_compact_threshold_percent = 85

[cli]
# Disable background update checks in scripts, CI, and headless mode.
auto_update = true
