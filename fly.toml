app = 'cheshire-clawd-terminal'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 250
    hard_limit = 300

  [http_service.tls_options]
    alpn = ['h2', 'http/1.1']

  [[http_service.checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '45s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048

[[statics]]
  guest_path = '/app/dist/public'
  url_prefix = '/'
