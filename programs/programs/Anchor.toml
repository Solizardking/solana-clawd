[toolchain]
anchor_version = "0.32.1"
solana_version = "1.18.20"

[features]
resolution = true
skip-lint = false

[programs.localnet]
solana_ai_inference = "Bg96xPuC3Mt2xnEnQPQBJY8QBqD6J7hn3WgnqDK43pKT"

[programs.devnet]
solana_ai_inference = "Bg96xPuC3Mt2xnEnQPQBJY8QBqD6J7hn3WgnqDK43pKT"

[programs.mainnet]
solana_ai_inference = "Bg96xPuC3Mt2xnEnQPQBJY8QBqD6J7hn3WgnqDK43pKT"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 5000
shutdown_wait = 2000
