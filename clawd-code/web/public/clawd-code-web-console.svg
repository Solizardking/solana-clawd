<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Animated Clawd Code web console</title>
  <desc id="desc">A stylized browser console with animated sidebar, chat stream, command palette, and status indicators.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="0.55" stop-color="#101827"/>
      <stop offset="1" stop-color="#111014"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="30" fill="#05070d"/>
  <rect x="34" y="32" width="1132" height="356" rx="24" fill="url(#bg)" stroke="#263449" stroke-width="2"/>
  <rect x="58" y="58" width="1084" height="44" rx="14" fill="#0b0f19" stroke="#334155"/>
  <circle cx="84" cy="80" r="6" fill="#ef4444"/>
  <circle cx="106" cy="80" r="6" fill="#f59e0b"/>
  <circle cx="128" cy="80" r="6" fill="#22c55e">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="160" y="86" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="18" fill="#dbeafe">localhost:3000 / clawd-code web</text>
  <rect x="58" y="120" width="230" height="238" rx="18" fill="#0b1220" stroke="#27364c"/>
  <text x="82" y="154" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#f8fafc">Clawd Code</text>
  <g>
    <rect x="82" y="182" width="160" height="14" rx="7" fill="#1e293b"/>
    <rect x="82" y="212" width="128" height="14" rx="7" fill="#1e293b"/>
    <rect x="82" y="242" width="176" height="14" rx="7" fill="#1e293b"/>
    <rect x="82" y="272" width="112" height="14" rx="7" fill="#1e293b"/>
    <rect x="82" y="302" width="148" height="14" rx="7" fill="#1e293b"/>
    <rect x="82" y="242" width="176" height="14" rx="7" fill="#8b5cf6" opacity="0.2">
      <animate attributeName="y" values="182;212;242;272;302;182" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="316" y="120" width="538" height="238" rx="18" fill="#0a0f1a" stroke="#27364c"/>
  <text x="342" y="154" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#e2e8f0">Streaming workspace</text>
  <rect x="342" y="180" width="410" height="32" rx="16" fill="#111827"/>
  <rect x="362" y="191" width="260" height="10" rx="5" fill="#64748b"/>
  <rect x="486" y="232" width="320" height="42" rx="18" fill="#172554"/>
  <rect x="508" y="247" width="210" height="10" rx="5" fill="#93c5fd"/>
  <rect x="342" y="294" width="386" height="38" rx="18" fill="#132017"/>
  <rect x="364" y="308" width="72" height="10" rx="5" fill="#86efac">
    <animate attributeName="width" values="72;320;180;286;72" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="880" y="120" width="238" height="238" rx="18" fill="#0b1220" stroke="#27364c"/>
  <text x="904" y="154" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#e2e8f0">Command palette</text>
  <rect x="904" y="178" width="190" height="30" rx="10" fill="#111827" stroke="#334155"/>
  <rect x="922" y="190" width="94" height="8" rx="4" fill="#94a3b8"/>
  <g filter="url(#soft)">
    <rect x="904" y="228" width="168" height="18" rx="9" fill="#22c55e" opacity="0.35">
      <animate attributeName="opacity" values="0.12;0.45;0.12" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="904" y="260" width="130" height="18" rx="9" fill="#38bdf8" opacity="0.35">
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="904" y="292" width="184" height="18" rx="9" fill="#a78bfa" opacity="0.35">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="342" y="338" width="474" height="1" fill="#38bdf8" opacity="0.7">
    <animate attributeName="x" values="342;816;342" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="width" values="24;120;24" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
