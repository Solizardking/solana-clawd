app = "clawd-gateway"
primary_region = "iad"

[build]
  dockerfile = "gateway/Dockerfile"
  context = ".."

[env]
  GATEWAY_PORT = "8080"
  GATEWAY_BASE_URL = "https://clawd-gateway.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1