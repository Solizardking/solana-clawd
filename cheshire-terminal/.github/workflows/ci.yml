name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - newnew

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Open-source audit
        run: pnpm run audit:open-source
