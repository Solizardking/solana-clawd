        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5.1s" repeatCount="indefinite" />
        <rect x="0" y="0" width="136" height="40" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(79,227,209,0.18)" />
        <text x="22" y="25" fill="#F4FBFF">Swap</text>
