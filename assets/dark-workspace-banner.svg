    <path d="M0 338C140 300 280 300 420 338C560 376 700 376 840 338C980 300 1090 308 1200 330" stroke-dasharray="12 16">
      <animate attributeName="stroke-dashoffset" values="0;28" dur="8s" repeatCount="indefinite" />
    </path>
  </g>

  <circle cx="918" cy="150" r="120" fill="#4FE3D1" opacity="0.09" filter="url(#blur)">
