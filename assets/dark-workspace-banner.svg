    <text x="0" y="68" fill="#F4FBFF" font-size="58" font-weight="700">Local-first Solana shell,</text>
    <text x="0" y="132" fill="#F4FBFF" font-size="58" font-weight="700">agent policy, DeFi, and swap lanes.</text>
    <text x="0" y="182" fill="#B6CADB" font-size="22">
      Public-safe docs, demo mode, and modular routing without exposing private keys.
    </text>
    <text x="0" y="228" fill="url(#accent)" font-size="20">
      dark-wallet • dark-agent • dark-defi • dark-swap
    </text>
  </g>

