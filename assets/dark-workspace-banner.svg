      <circle cx="0" cy="0" r="28" fill="#4FE3D1" opacity="0.18" />
      <path d="M-20 -2C-8 -26 8 -26 20 -2C20 16 0 34 0 34C0 34 -20 16 -20 -2Z" fill="#4FE3D1" />
