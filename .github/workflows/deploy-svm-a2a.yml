# ─────────────────────────────────────────────────────────────────────────────
# SVM-A2A Deploy — GitHub Actions CI/CD
#
# On push to main:
#   1. Install + lint + typecheck
#   2. Build all packages
#   3. Deploy Cloudflare Workers
#   4. Mint + register agent (devnet)
# ─────────────────────────────────────────────────────────────────────────────

name: SVM-A2A Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Root build
        run: pnpm run build

      - name: Typecheck SVM-A2A
        run: npm --prefix a2a run check

      - name: Build SVM-A2A
        run: npm --prefix a2a run build

      - name: Validate SVM-A2A mint metadata
        run: npm --prefix a2a run mint:dry

      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run
        working-directory: a2a

  deploy:
    name: Deploy SVM-A2A framework
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build SVM-A2A package
        run: npm --prefix a2a run build

      - name: Validate SVM-A2A deploy plan
        run: bash scripts/deploy-svm-a2a.sh --network devnet --dry-run

      - name: Run deployment script
        run: bash scripts/deploy-svm-a2a.sh --network devnet
        env:
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}

      - name: Verify agent card endpoint
        run: |
          curl -s https://api.svm-a2a.ai/.well-known/agent-card.json | head -5
          echo "✓ Agent card accessible"

      - name: Upload SVM-A2A dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: svm-a2a-dist
          path: a2a/dist
